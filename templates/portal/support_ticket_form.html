{% extends 'base.html' %}
{% load static %}
{% block title %}New Support Ticket — GymX{% endblock %}
{% block page_breadcrumb %}Portal / Support / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">New Support Ticket</h1></div>
  <a href="{% url 'portal:support' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Subject</label><input type="text" name="subject" class="form-control" /></div>
      <div class="mb-3"><label class="form-label">Category</label><select name="category" class="form-select">{% for v,l in categories %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
      <div class="mb-4"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="5"></textarea></div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'portal:support' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-paper-plane"></i> Submit Ticket</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
