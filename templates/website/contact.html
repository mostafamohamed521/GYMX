{% extends 'website/base_public.html' %}
{% block title %}Contact Us — GymX{% endblock %}
{% block content %}
<section class="gx-hero" style="padding:70px 0 60px;"><div class="container"><div class="gx-hero-eyebrow">Get In Touch</div><h1 style="font-size:40px;">Contact Us</h1></div></section>
<section class="gx-section">
  <div class="container">
    <div class="gx-grid gx-grid-2">
      <div class="gx-card">
        <h3 style="font-size:17px;margin-bottom:16px;">Send us a message</h3>
        <form method="post">
          {% csrf_token %}
          <div style="margin-bottom:14px;"><input type="text" name="name" placeholder="Your Name" required style="width:100%;padding:12px;border:1px solid #ECE7DA;border-radius:10px;font-family:inherit;font-size:13.5px;" /></div>
          <div style="margin-bottom:14px;"><input type="email" name="email" placeholder="Your Email" required style="width:100%;padding:12px;border:1px solid #ECE7DA;border-radius:10px;font-family:inherit;font-size:13.5px;" /></div>
          <div style="margin-bottom:14px;"><input type="text" name="phone" placeholder="Phone (optional)" style="width:100%;padding:12px;border:1px solid #ECE7DA;border-radius:10px;font-family:inherit;font-size:13.5px;" /></div>
          <div style="margin-bottom:14px;"><input type="text" name="subject" placeholder="Subject" style="width:100%;padding:12px;border:1px solid #ECE7DA;border-radius:10px;font-family:inherit;font-size:13.5px;" /></div>
          <div style="margin-bottom:18px;"><textarea name="message" placeholder="Your Message" rows="4" required style="width:100%;padding:12px;border:1px solid #ECE7DA;border-radius:10px;font-family:inherit;font-size:13.5px;"></textarea></div>
          <button type="submit" class="btn-gold" style="width:100%;justify-content:center;border:none;">Send Message</button>
        </form>
      </div>
      <div>
        <div class="gx-card" style="margin-bottom:16px;"><i class="fa-solid fa-location-dot" style="color:var(--gx-gold);margin-right:10px;"></i>123 El Gomhoria St, Mansoura, Egypt</div>
        <div class="gx-card" style="margin-bottom:16px;"><i class="fa-solid fa-phone" style="color:var(--gx-gold);margin-right:10px;"></i>01000000000</div>
        <div class="gx-card" style="margin-bottom:16px;"><i class="fa-solid fa-envelope" style="color:var(--gx-gold);margin-right:10px;"></i>info@gymx.com</div>
        <div class="gx-card"><i class="fa-solid fa-clock" style="color:var(--gx-gold);margin-right:10px;"></i>Open daily 6:00 AM – 11:00 PM</div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
