{% extends 'base.html' %}
{% load static %}
{% block title %}Schedule PT Session — GymX{% endblock %}
{% block page_breadcrumb %}Workouts / PT Sessions / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Schedule PT Session</h1></div>
  <a href="{% url 'workouts:pt_sessions' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card-gymx">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label">Member <span style="color:var(--danger);">*</span></label><select name="member" class="form-select"><option value="">— Select member —</option>{% for m in members %}<option value="{{ m.pk }}">{{ m.get_full_name }} ({{ m.member_id }})</option>{% endfor %}</select></div>
          <div class="mb-3"><label class="form-label">Coach <span style="color:var(--danger);">*</span></label><select name="coach" class="form-select"><option value="">— Select coach —</option>{% for c in coaches %}<option value="{{ c.pk }}">{{ c.get_full_name }}</option>{% endfor %}</select></div>
          <div class="mb-3"><label class="form-label">Date <span style="color:var(--danger);">*</span></label><input type="date" name="date" class="form-control" value="{{ today }}" /></div>
          <div class="row g-3 mb-3">
            <div class="col-6"><label class="form-label">Start Time</label><input type="time" name="start_time" class="form-control" value="08:00" /></div>
            <div class="col-6"><label class="form-label">End Time</label><input type="time" name="end_time" class="form-control" value="09:00" /></div>
          </div>
          <div class="mb-4"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3"></textarea></div>
          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'workouts:pt_sessions' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
            <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-calendar-plus"></i> Schedule</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
