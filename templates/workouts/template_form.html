{% extends 'base.html' %}
{% load static %}
{% block title %}New Template — GymX{% endblock %}
{% block page_breadcrumb %}Workouts / Templates / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">New Workout Template</h1></div>
  <a href="{% url 'workouts:templates' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card-gymx">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label">Template Name <span style="color:var(--danger);">*</span></label><input type="text" name="name" class="form-control" placeholder="e.g. 12-Week Muscle Gain" /></div>
          <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3" placeholder="Describe the program goals and structure..."></textarea></div>
          <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label">Goal</label><select name="goal" class="form-select">{% for val,label in goals %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
            <div class="col-md-6"><label class="form-label">Difficulty</label><select name="difficulty" class="form-select">{% for val,label in difficulties %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4"><label class="form-label">Duration (weeks)</label><input type="number" name="duration_weeks" class="form-control" value="4" min="1" max="52" /></div>
            <div class="col-md-4"><label class="form-label">Days per week</label><input type="number" name="days_per_week" class="form-control" value="3" min="1" max="7" /></div>
            <div class="col-md-4"><label class="form-label">Session (min)</label><input type="number" name="session_duration" class="form-control" value="60" min="15" /></div>
          </div>
          <div class="mb-4">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;"><input type="checkbox" name="is_public" checked style="width:16px;height:16px;accent-color:var(--primary);" /> Make this template public</label>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'workouts:templates' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
            <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-floppy-disk"></i> Save Template</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
