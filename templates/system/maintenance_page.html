<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Under Maintenance | GymX</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body{margin:0;font-family:'Segoe UI',sans-serif;background:#0A0A0B;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
  .wrap{max-width:500px;padding:24px;}
  i.icon{font-size:48px;color:#C9A24B;margin-bottom:16px;}
  h1{font-size:26px;margin:10px 0 14px;}
  p{color:rgba(255,255,255,0.65);font-size:14.5px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <i class="fa-solid fa-screwdriver-wrench icon"></i>
  <h1>We'll be right back!</h1>
  <p>{{ settings_obj.message }}</p>
  {% if settings_obj.ends_at %}<p style="margin-top:10px;font-size:13px;color:#C9A24B;">Expected back: {{ settings_obj.ends_at|date:"M d, Y H:i" }}</p>{% endif %}
</div>
</body>
</html>
