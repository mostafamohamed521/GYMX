<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>401 — Unauthorized | GymX</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Inter',sans-serif;background:#0A0A0B;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
  .wrap{max-width:480px;padding:24px;}
  .code{font-family:'Teko',sans-serif;font-size:150px;font-weight:700;background:linear-gradient(135deg,var(--warning),var(--danger));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;}
  h1{font-family:'Teko',sans-serif;font-size:28px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;margin:6px 0 12px;}
  p{color:rgba(255,255,255,0.6);font-size:14px;line-height:1.6;margin-bottom:28px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--warning);color:#0A0A0B;font-weight:700;padding:12px 26px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);text-decoration:none;font-size:14px;}
  i.icon{font-size:40px;color:var(--warning);margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  {% if is_preview %}<div style="font-size:11px;color:var(--warning);margin-bottom:16px;letter-spacing:1px;">PREVIEW MODE</div>{% endif %}
  <i class="fa-solid fa-lock icon"></i>
  <div class="code">401</div>
  <h1>Unauthorized Access</h1>
  <p>You need to sign in to view this page. Your session may have expired or you haven't logged in yet.</p>
  <a href="/accounts/login/" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Go to Login</a>
</div>
</body>
</html>
