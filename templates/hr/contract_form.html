{% extends 'base.html' %}
{% load static %}
{% block title %}New Contract — GymX{% endblock %}
{% block page_breadcrumb %}HR / Contracts / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">New Contract</h1></div>
  <a href="{% url 'hr:contracts' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card-gymx"><div class="card-body">
    <form method="post" enctype="multipart/form-data">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Employee <span style="color:var(--danger);">*</span></label><select name="employee" class="form-select">{% for e in employees %}<option value="{{ e.pk }}">{{ e.get_full_name }}</option>{% endfor %}</select></div>
      <div class="mb-3"><label class="form-label">Contract Type</label><input type="text" name="contract_type" class="form-control" value="Employment Contract" /></div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Start Date</label><input type="date" name="start_date" class="form-control" value="{{ today }}" /></div>
        <div class="col-md-6"><label class="form-label">End Date</label><input type="date" name="end_date" class="form-control" /></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Salary (EGP)</label><input type="number" name="salary" class="form-control" step="0.01" /></div>
        <div class="col-md-6"><label class="form-label">Status</label><select name="status" class="form-select">{% for v,l in statuses %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
      </div>
      <div class="mb-3"><label class="form-label">Document</label><input type="file" name="document" class="form-control" accept=".pdf,.doc,.docx" /></div>
      <div class="mb-4"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3"></textarea></div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'hr:contracts' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-file-signature"></i> Create Contract</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
