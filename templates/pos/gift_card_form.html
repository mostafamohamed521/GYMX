{% extends 'base.html' %}
{% load static %}
{% block title %}Issue Gift Card — GymX{% endblock %}
{% block page_breadcrumb %}POS / Gift Cards / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Issue Gift Card</h1></div>
  <a href="{% url 'pos:gift_cards' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Amount (EGP) <span style="color:var(--danger);">*</span></label><input type="number" name="initial_amount" class="form-control" step="0.01" placeholder="500" /></div>
      <div class="mb-3"><label class="form-label">Purchased By (Member)</label><select name="purchased_by" class="form-select"><option value="">— None —</option>{% for m in members %}<option value="{{ m.pk }}">{{ m.get_full_name }}</option>{% endfor %}</select></div>
      <div class="mb-3"><label class="form-label">Issued To (Name)</label><input type="text" name="issued_to" class="form-control" placeholder="Recipient name" /></div>
      <div class="mb-4"><label class="form-label">Expiry Date</label><input type="date" name="expiry_date" class="form-control" /></div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'pos:gift_cards' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-gift"></i> Issue Card</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
