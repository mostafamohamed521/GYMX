{% extends 'base.html' %}
{% load static %}
{% block title %}New Export — GymX{% endblock %}
{% block page_breadcrumb %}Reports / Export / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Generate Export</h1></div>
  <a href="{% url 'reports:export' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Report Name</label><input type="text" name="report_name" class="form-control" placeholder="e.g. Monthly Revenue Report" /></div>
      <div class="mb-4"><label class="form-label">Format</label><select name="format" class="form-select">{% for v,l in formats %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'reports:export' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-download"></i> Generate</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
