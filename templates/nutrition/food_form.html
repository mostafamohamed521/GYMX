{% extends 'base.html' %}
{% load static %}
{% block title %}Add Food — GymX{% endblock %}
{% block page_breadcrumb %}Nutrition / Foods / Add{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Add Food</h1></div>
  <a href="{% url 'nutrition:foods' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Food Name <span style="color:var(--danger);">*</span></label><input type="text" name="name" class="form-control" placeholder="e.g. Chicken Breast" /></div>
      <div class="mb-3"><label class="form-label">Category</label><select name="category" class="form-select"><option value="">— None —</option>{% for c in cats %}<option value="{{ c.pk }}">{{ c.name }}</option>{% endfor %}</select></div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Serving Size</label><input type="number" name="serving_size" class="form-control" value="100" step="0.1" /></div>
        <div class="col-md-6"><label class="form-label">Unit</label><select name="serving_unit" class="form-select">{% for val,label in units %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-3"><label class="form-label">Calories</label><input type="number" name="calories" class="form-control" value="0" step="0.1" /></div>
        <div class="col-md-3"><label class="form-label">Protein (g)</label><input type="number" name="protein" class="form-control" value="0" step="0.1" /></div>
        <div class="col-md-3"><label class="form-label">Carbs (g)</label><input type="number" name="carbs" class="form-control" value="0" step="0.1" /></div>
        <div class="col-md-3"><label class="form-label">Fat (g)</label><input type="number" name="fat" class="form-control" value="0" step="0.1" /></div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-4"><label class="form-label">Fiber (g)</label><input type="number" name="fiber" class="form-control" value="0" step="0.1" /></div>
        <div class="col-md-4"><label class="form-label">Sugar (g)</label><input type="number" name="sugar" class="form-control" value="0" step="0.1" /></div>
        <div class="col-md-4"><label class="form-label">Sodium (mg)</label><input type="number" name="sodium" class="form-control" value="0" step="0.1" /></div>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'nutrition:foods' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-floppy-disk"></i> Save Food</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
