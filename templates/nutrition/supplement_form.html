{% extends 'base.html' %}
{% load static %}
{% block title %}Add Supplement — GymX{% endblock %}
{% block page_breadcrumb %}Nutrition / Supplements / Add{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Add Supplement</h1></div>
  <a href="{% url 'nutrition:supplements' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Member <span style="color:var(--danger);">*</span></label><select name="member" class="form-select"><option value="">— Select —</option>{% for m in members %}<option value="{{ m.pk }}">{{ m.get_full_name }}</option>{% endfor %}</select></div>
      <div class="row g-3 mb-3">
        <div class="col-md-7"><label class="form-label">Supplement Name <span style="color:var(--danger);">*</span></label><input type="text" name="name" class="form-control" placeholder="e.g. Whey Protein" /></div>
        <div class="col-md-5"><label class="form-label">Brand</label><input type="text" name="brand" class="form-control" placeholder="e.g. Optimum Nutrition" /></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Dosage <span style="color:var(--danger);">*</span></label><input type="text" name="dosage" class="form-control" placeholder="e.g. 30g (1 scoop)" /></div>
        <div class="col-md-6"><label class="form-label">Frequency</label><select name="frequency" class="form-select">{% for val,label in frequencies %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Start Date</label><input type="date" name="start_date" class="form-control" value="{{ today }}" /></div>
        <div class="col-md-6"><label class="form-label">End Date</label><input type="date" name="end_date" class="form-control" /></div>
      </div>
      <div class="mb-4"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="3"></textarea></div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'nutrition:supplements' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-pills"></i> Add Supplement</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
