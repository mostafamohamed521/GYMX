{% extends 'base.html' %}
{% load static %}
{% block title %}Add Meal — GymX{% endblock %}
{% block page_breadcrumb %}Nutrition / Meals / Add{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Add Meal</h1></div>
  <a href="{% url 'nutrition:meals' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Meal Name <span style="color:var(--danger);">*</span></label><input type="text" name="name" class="form-control" placeholder="e.g. Grilled Chicken Salad" /></div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Meal Type</label><select name="meal_type" class="form-select">{% for val,label in meal_types %}<option value="{{ val }}">{{ label }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">Prep Time (min)</label><input type="number" name="prep_time_min" class="form-control" value="10" /></div>
      </div>
      <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
      <div class="mb-3"><label class="form-label">Instructions</label><textarea name="instructions" class="form-control" rows="4" placeholder="Step by step instructions..."></textarea></div>
      <div class="row g-3 mb-4">
        <div class="col-md-3"><label class="form-label">Calories</label><input type="number" name="total_calories" class="form-control" value="0" step="0.1" /></div>
        <div class="col-md-3"><label class="form-label">Protein (g)</label><input type="number" name="total_protein" class="form-control" value="0" step="0.1" /></div>
        <div class="col-md-3"><label class="form-label">Carbs (g)</label><input type="number" name="total_carbs" class="form-control" value="0" step="0.1" /></div>
        <div class="col-md-3"><label class="form-label">Fat (g)</label><input type="number" name="total_fat" class="form-control" value="0" step="0.1" /></div>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'nutrition:meals' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-floppy-disk"></i> Save Meal</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
