{% extends 'base.html' %}
{% load static %}
{% block title %}Restore — GymX{% endblock %}
{% block page_breadcrumb %}Settings / Restore{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Restore</h1></div>
  <a href="{% url 'gymsettings:backup' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Backups</a>
</div>
<div class="alert-gymx warning mb-4"><i class="fa-solid fa-triangle-exclamation"></i> Restoring will overwrite current data. This action cannot be undone.</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post" onsubmit="return confirm('Are you sure you want to restore this backup? Current data will be overwritten.')">{% csrf_token %}
      <div class="mb-4"><label class="form-label">Select Backup</label>
        <select name="backup_id" class="form-select">
          {% for b in backups %}<option value="{{ b.pk }}">{{ b.filename }} — {{ b.created_at|date:"M d, Y H:i" }}</option>{% endfor %}
        </select>
      </div>
      <button type="submit" class="btn-gymx danger" style="width:100%;justify-content:center;"><i class="fa-solid fa-rotate-left"></i> Restore This Backup</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
