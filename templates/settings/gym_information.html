{% extends 'base.html' %}
{% load static %}
{% block title %}Gym Information — GymX{% endblock %}
{% block page_breadcrumb %}Settings / Gym Information{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Gym Information</h1></div>
  <a href="{% url 'gymsettings:general' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="card-gymx"><div class="card-body">
    <form method="post" enctype="multipart/form-data">{% csrf_token %}
      <div style="text-align:center;margin-bottom:20px;">
        <div style="width:90px;height:90px;border-radius:var(--radius-xl);background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;margin:0 auto 10px;overflow:hidden;">
          {% if settings_obj.logo %}<img src="{{ settings_obj.logo.url }}" style="width:100%;height:100%;object-fit:cover;" />{% else %}<i class="fa-solid fa-dumbbell" style="color:white;font-size:28px;"></i>{% endif %}
        </div>
        <input type="file" name="logo" accept="image/*" class="form-control" style="max-width:250px;margin:0 auto;" />
      </div>
      <div class="row g-3">
        <div class="col-12"><label class="form-label">Gym Name</label><input type="text" name="gym_name" class="form-control" value="{{ settings_obj.gym_name }}" /></div>
        <div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ settings_obj.address }}</textarea></div>
        <div class="col-md-6"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" value="{{ settings_obj.phone }}" /></div>
        <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ settings_obj.email }}" /></div>
        <div class="col-12"><label class="form-label">Website</label><input type="url" name="website" class="form-control" value="{{ settings_obj.website }}" /></div>
      </div>
      <button type="submit" class="btn-gymx primary" style="width:100%;justify-content:center;margin-top:20px;"><i class="fa-solid fa-floppy-disk"></i> Save</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
