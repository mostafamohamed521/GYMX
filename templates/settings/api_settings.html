{% extends 'base.html' %}
{% load static %}
{% block title %}API Settings — GymX{% endblock %}
{% block page_breadcrumb %}Settings / API{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">API Settings</h1></div>
  <a href="{% url 'gymsettings:general' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">API Key</label>
        <div style="display:flex;gap:8px;">
          <input type="text" class="form-control" value="{{ settings_obj.api_key }}" readonly style="font-family:monospace;font-size:12px;" />
          <button type="submit" name="regenerate" value="1" class="btn-gymx outline" style="white-space:nowrap;"><i class="fa-solid fa-arrows-rotate"></i> Regenerate</button>
        </div>
      </div>
      <div class="mb-3"><label class="form-label">Webhook URL</label><input type="url" name="webhook_url" class="form-control" value="{{ settings_obj.webhook_url }}" /></div>
      <div class="mb-4"><label class="form-label">Rate Limit (requests/hour)</label><input type="number" name="api_rate_limit" class="form-control" value="{{ settings_obj.api_rate_limit }}" /></div>
      <button type="submit" class="btn-gymx primary" style="width:100%;justify-content:center;"><i class="fa-solid fa-floppy-disk"></i> Save Settings</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
