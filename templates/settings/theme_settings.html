{% extends 'base.html' %}
{% load static %}
{% block title %}Theme Settings — GymX{% endblock %}
{% block page_breadcrumb %}Settings / Theme{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Theme Settings</h1></div>
  <a href="{% url 'gymsettings:general' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Primary Color</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="color" name="primary_color" value="{{ settings_obj.primary_color }}" style="width:60px;height:40px;border:1px solid var(--border);border-radius:var(--radius-md);" />
          <span style="font-family:monospace;font-size:13px;color:var(--text-muted);">{{ settings_obj.primary_color }}</span>
        </div>
      </div>
      <label style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;margin:16px 0;"><span style="font-size:13.5px;font-weight:600;">Dark Mode by Default</span><input type="checkbox" name="dark_mode_default" {% if settings_obj.dark_mode_default %}checked{% endif %} style="width:18px;height:18px;accent-color:var(--primary);" /></label>
      <button type="submit" class="btn-gymx primary" style="width:100%;justify-content:center;"><i class="fa-solid fa-floppy-disk"></i> Save Theme</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
