{% extends 'base.html' %}
{% load static %}
{% block title %}Password Policy — GymX{% endblock %}
{% block page_breadcrumb %}Settings / Password Policy{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Password Policy</h1></div>
  <a href="{% url 'gymsettings:security' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Minimum Length</label><input type="number" name="password_min_length" class="form-control" value="{{ settings_obj.password_min_length }}" /></div>
      <label style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;"><span style="font-size:13.5px;">Require Uppercase Letter</span><input type="checkbox" name="password_require_upper" {% if settings_obj.password_require_upper %}checked{% endif %} style="width:18px;height:18px;accent-color:var(--primary);" /></label>
      <label style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;"><span style="font-size:13.5px;">Require Number</span><input type="checkbox" name="password_require_number" {% if settings_obj.password_require_number %}checked{% endif %} style="width:18px;height:18px;accent-color:var(--primary);" /></label>
      <label style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;"><span style="font-size:13.5px;">Require Special Symbol</span><input type="checkbox" name="password_require_symbol" {% if settings_obj.password_require_symbol %}checked{% endif %} style="width:18px;height:18px;accent-color:var(--primary);" /></label>
      <div class="mb-3 mt-3"><label class="form-label">Password Expiry (days)</label><input type="number" name="password_expiry_days" class="form-control" value="{{ settings_obj.password_expiry_days }}" /></div>
      <button type="submit" class="btn-gymx primary" style="width:100%;justify-content:center;margin-top:10px;"><i class="fa-solid fa-lock"></i> Save Policy</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
