{% extends 'base.html' %}
{% load static %}
{% block title %}New Announcement — GymX{% endblock %}
{% block page_breadcrumb %}Notifications / Announcements / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">New Announcement</h1></div>
  <a href="{% url 'notifications:announcements' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Title</label><input type="text" name="title" class="form-control" /></div>
      <div class="mb-3"><label class="form-label">Body</label><textarea name="body" class="form-control" rows="5"></textarea></div>
      <div class="mb-3"><label class="form-label">Priority</label><select name="priority" class="form-select">{% for v,l in priorities %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
      <div class="mb-3"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;"><input type="checkbox" name="is_pinned" style="width:16px;height:16px;accent-color:var(--primary);" /> Pin to top</label></div>
      <div class="mb-4"><label class="form-label">Ends At (optional)</label><input type="datetime-local" name="ends_at" class="form-control" /></div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'notifications:announcements' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-bullhorn"></i> Publish</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
