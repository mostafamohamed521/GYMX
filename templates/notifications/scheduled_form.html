{% extends 'base.html' %}
{% load static %}
{% block title %}Schedule Message — GymX{% endblock %}
{% block page_breadcrumb %}Notifications / Scheduled / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Schedule Message</h1></div>
  <a href="{% url 'notifications:scheduled' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" /></div>
      <div class="mb-3"><label class="form-label">Channel</label><select name="channel" class="form-select">{% for v,l in channels %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
      <div class="mb-3"><label class="form-label">Target Audience</label><input type="text" name="target_audience" class="form-control" value="All members" /></div>
      <div class="mb-3"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="4"></textarea></div>
      <div class="mb-4"><label class="form-label">Scheduled For</label><input type="datetime-local" name="scheduled_for" class="form-control" /></div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'notifications:scheduled' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-clock"></i> Schedule</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
