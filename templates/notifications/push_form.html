{% extends 'base.html' %}
{% load static %}
{% block title %}New Push Notification — GymX{% endblock %}
{% block page_breadcrumb %}Notifications / Push / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">New Push Notification</h1></div>
  <a href="{% url 'notifications:push' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Title</label><input type="text" name="title" class="form-control" /></div>
      <div class="mb-3"><label class="form-label">Message</label><textarea name="message" class="form-control" rows="3" maxlength="250"></textarea></div>
      <div class="mb-3"><label class="form-label">Target Audience</label><input type="text" name="target_audience" class="form-control" value="All members" /></div>
      <div class="mb-3"><label class="form-label">Status</label><select name="status" class="form-select">{% for v,l in statuses %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
      <div class="mb-4"><label class="form-label">Schedule For (optional)</label><input type="datetime-local" name="scheduled_at" class="form-control" /></div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'notifications:push' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-bell"></i> Create</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
