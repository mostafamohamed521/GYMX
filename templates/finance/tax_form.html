{% extends 'base.html' %}
{% load static %}
{% block title %}New Tax Record — GymX{% endblock %}
{% block page_breadcrumb %}Finance / Taxes / New{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">New Tax Record</h1></div>
  <a href="{% url 'finance:taxes' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Tax Type</label><select name="tax_type" class="form-select">{% for v,l in tax_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label">Period Start</label><input type="date" name="period_start" class="form-control" /></div>
        <div class="col-md-6"><label class="form-label">Period End</label><input type="date" name="period_end" class="form-control" /></div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-6"><label class="form-label">Taxable Amount (EGP)</label><input type="number" name="taxable_amount" class="form-control" step="0.01" /></div>
        <div class="col-md-6"><label class="form-label">Tax Rate (%)</label><input type="number" name="tax_rate" class="form-control" value="14" step="0.01" /></div>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'finance:taxes' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-percent"></i> Create Record</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
