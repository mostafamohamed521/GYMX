{% extends 'base.html' %}
{% load static %}
{% block title %}Add Account — GymX{% endblock %}
{% block page_breadcrumb %}Finance / Accounts / Add{% endblock %}
{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div><h1 class="page-title">Add Account</h1></div>
  <a href="{% url 'finance:accounts' %}" class="btn-gymx outline" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
</div>
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card-gymx"><div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Code</label><input type="text" name="code" class="form-control" placeholder="e.g. 1010" /></div>
        <div class="col-md-8"><label class="form-label">Name</label><input type="text" name="name" class="form-control" /></div>
        <div class="col-12"><label class="form-label">Type</label><select name="account_type" class="form-select">{% for v,l in account_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
        <div class="col-12"><label class="form-label">Description</label><input type="text" name="description" class="form-control" /></div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <a href="{% url 'finance:accounts' %}" class="btn-gymx outline" style="text-decoration:none;">Cancel</a>
        <button type="submit" class="btn-gymx primary"><i class="fa-solid fa-plus"></i> Add Account</button>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
